services:
  redis:
    image: redis:7-alpine
    networks:
      - appnet
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-blue:
    build: .
    profiles: [blue]
    environment:
      - REDIS_HOST=redis
      - APP_COLOR=blue
    networks:
      - appnet
    depends_on:
      redis:
        condition: service_healthy

  app-green:
    build: .
    profiles: [green]
    environment:
      - REDIS_HOST=redis
      - APP_COLOR=green
    networks:
      - appnet
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    depends_on:
      - redis

networks:
  appnet:

volumes:
  redis-data:
