services:
  web:
    build: .
    ports:
      - "5000:5000"
    networks:
      - appnet
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    networks:
      - appnet
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  appnet:

volumes:
  redis-data:
